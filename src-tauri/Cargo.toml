[package]
name = "codex-config-studio"
version = "0.5.0"
description = "Manage Codex global and project model profiles safely"
authors = ["Codex Config Studio"]
edition = "2021"

[lib]
name = "codex_config_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
toml_edit = "0.23"
