name: verify-first-write-fix

on:
  push:
    branches: [master]
    paths: ['.github/workflows/verify-first-write.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-first-write-fix
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: first-write-regression
      - name: Load pinned test candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git hash-object src-tauri/src/lib.rs)" = fb06a643222ec0edd6092b19a40023981846e608
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/1551dd0696a985293fd09d60462090eec08c2bc5" --jq .content | base64 --decode > /tmp/patch_first_write.py
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/9ad4158f34224697e419de9b1abfabe41d0da57d" --jq .content | base64 --decode > /tmp/config_tests.rs
          python3 -m py_compile /tmp/patch_first_write.py
      - name: Prepare frontend and native resources
        run: |
          npm ci
          npm run tauri icon src-tauri/icons/icon.svg
          npm run verify:icons
          npm run build
      - name: Reproduce original first-apply failure
        shell: bash
        run: |
          python3 /tmp/patch_first_write.py --reproduce
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked reproduce_missing_agents_first_apply -- --nocapture > repro.log 2>&1
          code=$?
          set -e
          cat repro.log
          test "$code" -ne 0
          grep -F 'index not found' repro.log
          grep -F 'test result: FAILED' repro.log
          echo 'Original first-apply failure reproduced in the actual configuration write function.' >> "$GITHUB_STEP_SUMMARY"
      - name: Apply candidate only in test checkout
        run: |
          git restore -- src-tauri/src/lib.rs
          python3 /tmp/patch_first_write.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
      - name: Run real configuration regression tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked -- --nocapture 2>&1 | tee tests.log
          grep 'test result:' tests.log >> "$GITHUB_STEP_SUMMARY"
      - name: Verify frontend compilation after UI fix
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend.log
      - name: Commit only the tested application fix
        run: |
          current=$(git ls-remote origin refs/heads/master | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/lib.rs src-tauri/src/config_tests.rs src/main.ts
          git diff --cached --check
          git commit -m 'Fix missing agents table on first apply with file-I/O regression tests'
          git push origin HEAD:master
          echo "Tested fix commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-write-regression-evidence
          path: |
            repro.log
            tests.log
            frontend.log
          retention-days: 7
          if-no-files-found: warn
