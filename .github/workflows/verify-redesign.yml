name: verify-redesign

on:
  push:
    branches:
      - redesign-workspace-v2
    paths:
      - ".github/workflows/verify-redesign.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev

      - name: Reconstruct redesign payload
        shell: bash
        run: |
          cat .redesign/part*.txt | base64 -d | tar -xz
          python scripts/apply-redesign.py

      - name: Frontend compile check
        run: |
          npm ci
          npm run build

      - name: Rust compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Commit verified redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-redesign.py
          git add src/main.ts src/styles.css src-tauri/src/lib.rs src/i18n README.md RELEASE_NOTES.md
          git diff --cached --check
          git commit -m "Redesign workspace, add history and harden writes"
          git push origin HEAD:redesign-workspace-v2
