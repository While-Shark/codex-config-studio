name: Refresh updater lock

on:
  push:
    branches:
      - feature/signed-updater
    paths:
      - "src-tauri/Cargo.toml"
      - ".github/workflows/refresh-updater-lock.yml"

permissions:
  contents: write

concurrency:
  group: refresh-signed-updater-lock
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/signed-updater

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve updater dependencies
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock already current."
            exit 0
          fi
          cp src-tauri/Cargo.lock /tmp/Cargo.lock.updated
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin feature/signed-updater
          cp /tmp/Cargo.lock.updated src-tauri/Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore: refresh updater Cargo.lock [skip ci]"
          git push origin HEAD:feature/signed-updater
