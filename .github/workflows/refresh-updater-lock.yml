name: Refresh updater lock

on:
  push:
    branches:
      - feature/signed-updater
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/src/updater.rs"
      - ".github/workflows/refresh-updater-lock.yml"

permissions:
  contents: write

concurrency:
  group: refresh-signed-updater-lock
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/signed-updater

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: updater-lock

      - name: Resolve updater dependency and compile
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore: refresh updater Cargo.lock [skip ci]"
          git push origin HEAD:feature/signed-updater
