name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for the next release
        required: true
        default: minor
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare-release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-meta.outputs.version }}
      tag: ${{ steps.release-meta.outputs.tag }}
      commit_sha: ${{ steps.release-meta.outputs.commit_sha }}
      previous_tag: ${{ steps.release-meta.outputs.previous_tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare automatic version bump
        if: github.event_name == 'workflow_dispatch'
        id: auto-version
        shell: bash
        run: |
          version=$(node scripts/prepare-release.mjs "${{ inputs.bump }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm ci
          npm run build
          cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 >/dev/null

      - name: Commit release version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version="${{ steps.auto-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): v${version} [skip ci]"
          git push origin HEAD:master

      - name: Resolve release metadata
        id: release-meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ steps.auto-version.outputs.version }}"
            tag="v${version}"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            package_version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
            if [ "$package_version" != "$version" ]; then
              echo "Tag $tag does not match package version $package_version."
              exit 1
            fi
          fi

          commit_sha=$(git rev-parse HEAD)
          previous_tag=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${tag}$" | head -n 1 || true)

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: build-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: --bundles nsis
            artifact: codex-config-studio-windows-x64
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/nsis/*-setup.exe.sig

          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles appimage,deb
            artifact: codex-config-studio-linux-x64
            artifact_path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/deb/*.deb.sig

          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            artifact: codex-config-studio-macos-universal
            artifact_path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Tauri Linux bundler tools
        if: matrix.name == 'linux-x64'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-linux-bundler-v1-${{ runner.arch }}
          restore-keys: |
            tauri-linux-bundler-v1-

      - name: Install Linux system dependencies
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: matrix.name == 'macos-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare optional macOS Developer ID signing
        if: matrix.name == 'macos-universal'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          any_apple_secret=false
          for value in             "$APPLE_CERTIFICATE"             "$APPLE_CERTIFICATE_PASSWORD"             "$APPLE_API_KEY"             "$APPLE_API_ISSUER"             "$APPLE_API_KEY_CONTENT"             "$APPLE_ID"             "$APPLE_PASSWORD"             "$APPLE_TEAM_ID"
          do
            if [ -n "$value" ]; then
              any_apple_secret=true
              break
            fi
          done

          if [ "$any_apple_secret" = false ]; then
            echo "APPLE_PLATFORM_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "::notice::Apple Developer signing/notarization is not configured; macOS artifacts remain unsigned."
            exit 0
          fi

          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::error::APPLE_CERTIFICATE and APPLE_CERTIFICATE_PASSWORD must both be configured for macOS Developer ID signing."
            exit 1
          fi

          api_count=0
          [ -n "$APPLE_API_KEY" ] && api_count=$((api_count + 1))
          [ -n "$APPLE_API_ISSUER" ] && api_count=$((api_count + 1))
          [ -n "$APPLE_API_KEY_CONTENT" ] && api_count=$((api_count + 1))

          apple_id_count=0
          [ -n "$APPLE_ID" ] && apple_id_count=$((apple_id_count + 1))
          [ -n "$APPLE_PASSWORD" ] && apple_id_count=$((apple_id_count + 1))
          [ -n "$APPLE_TEAM_ID" ] && apple_id_count=$((apple_id_count + 1))

          if [ "$api_count" -ne 0 ] && [ "$api_count" -ne 3 ]; then
            echo "::error::App Store Connect notarization requires APPLE_API_KEY, APPLE_API_ISSUER, and APPLE_API_KEY_CONTENT together."
            exit 1
          fi
          if [ "$apple_id_count" -ne 0 ] && [ "$apple_id_count" -ne 3 ]; then
            echo "::error::Apple ID notarization requires APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID together."
            exit 1
          fi
          if [ "$api_count" -eq 0 ] && [ "$apple_id_count" -eq 0 ]; then
            echo "::error::Developer ID signing is configured but notarization credentials are missing."
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/codex-config-studio-developer-id.p12"
          keychain_path="$RUNNER_TEMP/codex-config-studio-build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path"             -k "$keychain_path"             -P "$APPLE_CERTIFICATE_PASSWORD"             -T /usr/bin/codesign             -T /usr/bin/security
          security default-keychain -s "$keychain_path"
          security set-key-partition-list             -S apple-tool:,apple:,codesign:             -s             -k "$keychain_password"             "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F'"' '/Developer ID Application:/{print $2; exit}')"
          if [ -z "$signing_identity" ]; then
            echo "::error::No Developer ID Application identity was found in the imported certificate."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "APPLE_PLATFORM_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          echo "APPLE_BUILD_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "Apple Developer signing identity: $signing_identity"

          if [ "$api_count" -eq 3 ]; then
            api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$api_key_path"
            chmod 600 "$api_key_path"
            echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
            echo "APPLE_NOTARIZATION_MODE=api-key" >> "$GITHUB_ENV"
            echo "Notarization authentication: App Store Connect API key."
          else
            echo "APPLE_NOTARIZATION_MODE=apple-id" >> "$GITHUB_ENV"
            echo "Notarization authentication: Apple ID app-specific password."
          fi

      - name: Validate signed updater secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          test -n "$TAURI_UPDATER_PUBKEY" || { echo "Missing TAURI_UPDATER_PUBKEY"; exit 1; }

      - name: Enable signed updater artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: node scripts/prepare-updater-build.mjs

      - name: Generate and validate icons
        shell: bash
        run: |
          npm run tauri icon src-tauri/icons/icon.svg
          npm run verify:icons

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}

      - name: Verify macOS Developer ID signature and notarization
        if: matrix.name == 'macos-universal'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${APPLE_PLATFORM_SIGNING_ENABLED:-false}" != "true" ]; then
            echo "::notice::Skipping Apple signature/notarization verification because Apple signing is not configured."
            exit 0
          fi

          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle"
          app_path="$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -print -quit)"
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"

          test -n "$app_path" || { echo "::error::Signed macOS .app bundle was not found."; exit 1; }
          test -n "$dmg_path" || { echo "::error::Signed macOS .dmg bundle was not found."; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q 'Authority=Developer ID Application:' || {
            echo "::error::The macOS app is not signed with a Developer ID Application identity."
            exit 1
          }
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$dmg_path"

          echo "Verified Developer ID signature and stapled notarization ticket."

      - name: Run configuration regression tests before uploading
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            host=$(rustc -vV | sed -n 's/^host: //p')
            cargo test --manifest-path src-tauri/Cargo.toml --lib --release --locked --target "$host"
          else
            cargo test --manifest-path src-tauri/Cargo.toml --lib --release --locked
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup macOS signing material
        if: always() && matrix.name == 'macos-universal'
        shell: bash
        run: |
          if [ -n "${APPLE_BUILD_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$APPLE_BUILD_KEYCHAIN_PATH" || true
          fi
          rm -f             "$RUNNER_TEMP/codex-config-studio-developer-id.p12"             "$RUNNER_TEMP"/AuthKey_*.p8

  publish:
    needs: [prepare, build]
    name: publish-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Collect release files and checksums
        shell: bash
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( \
            -name "*.exe" -o \
            -name "*.exe.sig" -o \
            -name "*.AppImage" -o \
            -name "*.AppImage.sig" -o \
            -name "*.deb" -o \
            -name "*.deb.sig" -o \
            -name "*.dmg" -o \
            -name "*.app.tar.gz" -o \
            -name "*.app.tar.gz.sig" \
          \) -exec cp {} release-files/ \;
          test -n "$(find release-files -maxdepth 1 -type f -print -quit)"
          node scripts/build-updater-manifest.mjs release-files "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.tag }}" "$GITHUB_REPOSITORY"
          (cd release-files && sha256sum * > SHA256SUMS.txt)

      - name: Build multilingual release notes
        shell: bash
        run: |
          cp RELEASE_NOTES.md release-body.md
          {
            echo
            echo "---"
            echo
            echo "## Commits / 提交记录 / 提交紀錄 / コミット / 커밋"
            if [ -n "${{ needs.prepare.outputs.previous_tag }}" ]; then
              git log --pretty='- %s (%h)' "${{ needs.prepare.outputs.previous_tag }}..${{ needs.prepare.outputs.commit_sha }}"
            else
              git log -20 --pretty='- %s (%h)' "${{ needs.prepare.outputs.commit_sha }}"
            fi
          } >> release-body.md

      - name: Create automatic tag if needed
        shell: bash
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "$tag already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "${{ needs.prepare.outputs.commit_sha }}" -m "Codex Config Studio $tag"
          git push origin "$tag"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-files/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes-file release-body.md
          else
            gh release create "$tag" release-files/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$tag" \
              --notes-file release-body.md
          fi
