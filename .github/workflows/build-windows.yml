name: Nightly

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "screenshots/**"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "screenshots/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: frontend-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

  build:
    needs: check
    name: build-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: --bundles nsis
            artifact: codex-config-studio-windows-x64
            artifact_path: src-tauri/target/release/bundle/nsis/*-setup.exe

          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles appimage,deb
            artifact: codex-config-studio-linux-x64
            artifact_path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb

          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            artifact: codex-config-studio-macos-universal
            artifact_path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Tauri Linux bundler tools
        if: matrix.name == 'linux-x64'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-linux-bundler-v1-${{ runner.arch }}
          restore-keys: |
            tauri-linux-bundler-v1-

      - name: Install Linux system dependencies
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: matrix.name == 'macos-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate platform icons
        run: npm run tauri icon src-tauri/icons/icon.svg

      - name: Validate generated icons
        run: npm run verify:icons

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      - name: Run configuration regression tests before uploading
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            host=$(rustc -vV | sed -n 's/^host: //p')
            cargo test --manifest-path src-tauri/Cargo.toml --lib --release --locked --target "$host"
          else
            cargo test --manifest-path src-tauri/Cargo.toml --lib --release --locked
          fi

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  nightly:
    name: publish-nightly
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( \
            -name "*.exe" -o \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.dmg" \
          \) -exec cp {} release-files/ \;
          test -n "$(find release-files -maxdepth 1 -type f -print -quit)"

      - name: Publish latest development release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly \
            --repo "$GITHUB_REPOSITORY" \
            --yes \
            --cleanup-tag || true

          gh release create nightly release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "nightly" \
            --notes "Automatically built from the latest successful master commit ($GITHUB_SHA)." \
            --prerelease
