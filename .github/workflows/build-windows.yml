name: build-desktop

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: frontend-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Type-check and build frontend
        run: npm run build

  build:
    needs: check
    name: build-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: --bundles nsis
            artifact: codex-config-studio-windows-x64
            artifact_path: src-tauri/target/release/bundle/nsis/*-setup.exe

          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles appimage,deb
            artifact: codex-config-studio-linux-x64
            artifact_path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb

          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            artifact: codex-config-studio-macos-universal
            artifact_path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Linux system dependencies
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: matrix.name == 'macos-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm install

      - name: Generate platform icons
        run: npm run tauri icon src-tauri/icons/icon.svg

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Publish cross-platform GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(
            find release-artifacts -type f \( \
              -name "*.exe" -o \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.dmg" \
            \) -print0
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --title "Codex Config Studio ${GITHUB_REF_NAME}" \
            --generate-notes
