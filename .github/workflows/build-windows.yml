name: Nightly

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "screenshots/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: frontend-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

  build:
    if: ${{ !contains(github.event.head_commit.message, '[actions-maintenance]') }}
    needs: check
    name: build-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: --bundles nsis
            artifact: codex-config-studio-windows-x64
            artifact_path: src-tauri/target/release/bundle/nsis/*-setup.exe

          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles appimage,deb
            artifact: codex-config-studio-linux-x64
            artifact_path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb

          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            artifact: codex-config-studio-macos-universal
            artifact_path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Tauri Linux bundler tools
        if: matrix.name == 'linux-x64'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-linux-bundler-v1-${{ runner.arch }}
          restore-keys: |
            tauri-linux-bundler-v1-

      - name: Install Linux system dependencies
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: matrix.name == 'macos-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate platform icons
        run: npm run tauri icon src-tauri/icons/icon.svg

      - name: Validate generated icons
        run: npm run verify:icons

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      - name: Run configuration regression tests before uploading
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            host=$(rustc -vV | sed -n 's/^host: //p')
            cargo test --manifest-path src-tauri/Cargo.toml --lib --release --locked --target "$host"
          else
            cargo test --manifest-path src-tauri/Cargo.toml --lib --release --locked
          fi

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  nightly:
    name: publish-nightly
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( \
            -name "*.exe" -o \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.dmg" \
          \) -exec cp {} release-files/ \;
          test -n "$(find release-files -maxdepth 1 -type f -print -quit)"

      - name: Publish latest development release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly \
            --repo "$GITHUB_REPOSITORY" \
            --yes \
            --cleanup-tag || true

          gh release create nightly release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "nightly" \
            --notes "Automatically built from the latest successful master commit ($GITHUB_SHA)." \
            --prerelease

  cleanup_legacy_workflows:
    name: Remove retired verification history
    needs: check
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[actions-maintenance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Clean only the six retired verification workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY_CLEANUP'
          """One-time, closed-allowlist cleanup of retired verification workflow runs."""
          import json
          import os
          from collections import Counter
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          REPOSITORY = 'While-Shark/codex-config-studio'
          TARGETS = {
              name: f'.github/workflows/{name}.yml'
              for name in (
                  'verify-gpt6-catalog', 'verify-history-tab', 'verify-model-picker',
                  'verify-presets-release', 'verify-redesign', 'verify-workspace-ui',
              )
          }
          KEEP = {'.github/workflows/build-windows.yml', '.github/workflows/release.yml'}


          def is_target(item):
              return item.get('name') in TARGETS and item.get('path') == TARGETS[item['name']]


          def pages(api, endpoint, key):
              result = []
              for page in range(1, 21):
                  batch = api('GET', f'{endpoint}?per_page=100&page={page}')[key]
                  result.extend(batch)
                  if len(batch) < 100:
                      return result
              raise RuntimeError('Pagination limit reached; no partial cleanup is allowed.')


          def cleanup(api):
              # Verify that these are retired files, not still-enabled source workflows.
              files = api('GET', 'contents/.github/workflows?ref=master')
              paths = {item['path'] for item in files if item['type'] == 'file'}
              if not KEEP.issubset(paths) or paths.intersection(TARGETS.values()):
                  raise RuntimeError('Unexpected workflow files on master; refusing cleanup.')
              workflows = pages(api, 'actions/workflows', 'workflows')
              runs = pages(api, 'actions/runs', 'workflow_runs')
              selected = [run for run in runs if is_target(run)]
              protected = {run['id'] for run in runs if not is_target(run)}
              if len(selected) > 100:
                  raise RuntimeError('More than 100 retired runs; refusing an oversized cleanup.')
              if any(run['status'] != 'completed' for run in selected):
                  raise RuntimeError('A targeted verification run is still active; nothing deleted.')
              print('Cleanup plan:', json.dumps(dict(Counter(run['name'] for run in selected)), sort_keys=True), flush=True)
              for workflow in workflows:
                  if is_target(workflow) and workflow['state'] == 'active':
                      api('PUT', f"actions/workflows/{int(workflow['id'])}/disable")
              deleted = []
              for run in selected:
                  run_id = int(run['id'])
                  current = api('GET', f'actions/runs/{run_id}')
                  if not is_target(current) or current['workflow_id'] != run['workflow_id'] or current['status'] != 'completed':
                      raise RuntimeError(f'Run {run_id} changed since inspection; stopping.')
                  api('DELETE', f'actions/runs/{run_id}')
                  deleted.append({'id': run_id, 'workflow': run['name']})
                  print(f"Deleted retired verification: {run['name']} / {run_id}", flush=True)
              remaining = pages(api, 'actions/runs', 'workflow_runs')
              if any(is_target(run) for run in remaining):
                  raise RuntimeError('Targeted verification history still exists; inspect before retrying.')
              if not protected.issubset({run['id'] for run in remaining}):
                  raise RuntimeError('A non-target run disappeared during cleanup; investigate.')
              workflows_after = pages(api, 'actions/workflows', 'workflows')
              report = {
                  'deleted_count': len(deleted), 'deleted': deleted,
                  'protected_run_count': len(protected), 'remaining_target_runs': 0,
                  'active_workflows': [
                      {'name': item['name'], 'path': item['path']}
                      for item in workflows_after if item['state'] == 'active'
                  ],
                  'retired_workflow_states': [
                      {'name': item['name'], 'state': item['state']}
                      for item in workflows_after if is_target(item)
                  ],
              }
              print(json.dumps(report, indent=2), flush=True)
              return report


          def main():
              if os.environ.get('GITHUB_REPOSITORY') != REPOSITORY or os.environ.get('GITHUB_REF') != 'refs/heads/master':
                  raise RuntimeError('This one-time cleanup is restricted to the requested repository/master.')
              token = os.environ['GH_TOKEN']
              def api(method, endpoint):
                  request = Request(f'https://api.github.com/repos/{REPOSITORY}/{endpoint}', method=method, headers={
                      'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'codex-config-studio-actions-maintenance',
                  })
                  try:
                      with urlopen(request, timeout=30) as response:
                          data = response.read()
                          return json.loads(data) if data else None
                  except HTTPError as error:
                      raise RuntimeError(f'{method} {endpoint} failed with HTTP {error.code}; stopping.') from None
              report = cleanup(api)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## Retired verification cleanup\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n')


          if __name__ == '__main__':
              main()
          PY_CLEANUP
